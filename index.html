<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Discovery Hub · Multi-Platform Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Sora:wght@300;400;600;700&family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="subtitle">Multi-Platform Discovery</div>
            <h1>AI Discovery Hub</h1>

            <div class="platform-tabs">
                <div class="platform-tab active" data-platform="github">
                    🐙 GitHub
                </div>
                <div class="platform-tab" data-platform="huggingface">
                    🤗 HuggingFace
                    <span class="badge">NEW</span>
                </div>
                <div class="platform-tab" data-platform="llmarena">
                    🏆 LLM Arena
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="toolbar-button" id="bookmarksBtn">
                    ⭐ Bookmarks (<span id="bookmarkCount">0</span>)
                </button>
                <button class="toolbar-button" id="browseBtn">
                    🔭 Browse
                </button>
                <button class="toolbar-button" id="aiStackBtn" title="Repos you've added to your AI setup">
                    🤖 My AI Stack (<span id="aiStackCount">0</span>)
                </button>
                <button class="toolbar-button" id="exportBtn" title="Download your bookmarks as a JSON file">
                    ⬇ Export
                </button>
                <button class="toolbar-button" id="importBtn" title="Restore bookmarks from a JSON file">
                    ⬆ Import
                </button>
                <input type="file" id="importInput" accept="application/json,.json" hidden />
            </div>
            <div class="view-mode-buttons">
                <button class="toolbar-button active" data-view="grid">
                    ▦ Grid
                </button>
                <button class="toolbar-button" data-view="list">
                    ☰ List
                </button>
                <button class="toolbar-button" data-view="compact">
                    ▤ Compact
                </button>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <div class="control-group search-group">
                <label class="control-label">Search</label>
                <div class="search-row">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Filter results, or press Enter to search everywhere"
                    />
                    <button class="toolbar-button" id="globalSearchBtn" title="Search the whole platform, not just the loaded results">
                        🔍 Search all
                    </button>
                </div>
            </div>

            <div class="control-group" id="dateRangeGroup">
                <label class="control-label">Created After</label>
                <input
                    type="date"
                    id="dateFrom"
                    class="date-input"
                />
            </div>

            <div class="control-group" id="dateToGroup">
                <label class="control-label">Created Before</label>
                <input
                    type="date"
                    id="dateTo"
                    class="date-input"
                />
            </div>

            <div class="control-group" id="languageGroup">
                <label class="control-label">Languages</label>
                <select id="languageFilter" class="filter-select multi-select" multiple>
                </select>
            </div>

            <div class="control-group" id="categoryGroup" style="display: none;">
                <label class="control-label">Category</label>
                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                    <option value="nlp">NLP</option>
                    <option value="computer-vision">Computer Vision</option>
                    <option value="audio">Audio</option>
                    <option value="multimodal">Multimodal</option>
                    <option value="reinforcement-learning">RL</option>
                    <option value="tabular">Tabular</option>
                </select>
            </div>

            <div class="control-group" id="sortGroup">
                <label class="control-label">Sort By</label>
                <select id="sortBy" class="filter-select">
                    <option value="stars">Most Stars</option>
                    <option value="forks">Most Forks</option>
                    <option value="updated">Recently Updated</option>
                    <option value="created">Recently Created</option>
                    <option value="issues">Most Issues</option>
                </select>
            </div>

            <div class="results-count">
                <span class="count" id="resultsCount">0</span> results
            </div>
        </div>

        <!-- Search scope banner (shown when viewing platform-wide search results) -->
        <div id="searchScopeBanner"></div>

        <!-- Content Container -->
        <div id="contentContainer">
            <div class="loading">Loading discoveries</div>
        </div>
    </main>

    <footer>
        <p>Powered by <span class="footer-accent">GitHub</span> · <span class="footer-accent">HuggingFace</span> · <span class="footer-accent">LLM Arena</span></p>
        <p style="margin-top: 0.5rem; opacity: 0.7; font-size: 0.9rem;">Last Updated: <span id="lastUpdate">...</span></p>
    </footer>

    <!-- "Add to my AI" install panel -->
    <div class="modal-overlay" id="aiModal"></div>

    <script src="js/app.js"></script>
</body>
</html>
