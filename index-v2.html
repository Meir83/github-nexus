<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Discovery Hub · Multi-Platform Trending</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Sora:wght@300;400;600;700&family=Oxanium:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-dark: #0a0e1a;
            --space-medium: #1a1f2e;
            --space-light: #2a2f3e;
            --electric-cyan: #00d4ff;
            --neon-blue: #0066ff;
            --neon-purple: #9d4edd;
            --neon-pink: #ff006e;
            --neon-green: #00ff88;
            --pure-white: #ffffff;
            --off-white: #f0f4f8;
            --text-gray: #a0aec0;
            --border-gray: rgba(255, 255, 255, 0.1);
            --glow-cyan: rgba(0, 212, 255, 0.3);
            --glow-blue: rgba(0, 102, 255, 0.2);
            --glow-purple: rgba(157, 78, 221, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--space-dark);
            color: var(--off-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: -300px;
            right: -300px;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--glow-cyan) 0%, transparent 70%);
            animation: float 25s infinite ease-in-out;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-30px, -30px) rotate(10deg); }
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 20px var(--glow-cyan),
                    0 0 40px var(--glow-blue),
                    0 4px 8px rgba(0, 0, 0, 0.5);
            }
            to {
                text-shadow:
                    0 0 30px var(--glow-cyan),
                    0 0 60px var(--glow-blue),
                    0 4px 8px rgba(0, 0, 0, 0.5);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--space-medium) 0%, var(--space-dark) 100%);
            padding: 3rem 2rem 2rem;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid var(--electric-cyan);
            box-shadow: 0 0 40px var(--glow-cyan);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--electric-cyan) 50%,
                transparent 100%);
            animation: scanline 3s linear infinite;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 900;
            color: var(--pure-white);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            text-shadow:
                0 0 20px var(--glow-cyan),
                0 0 40px var(--glow-blue),
                0 4px 8px rgba(0, 0, 0, 0.5);
            animation: slideDown 1s ease-out, glow 3s ease-in-out infinite alternate;
        }

        .subtitle {
            font-family: 'Oxanium', sans-serif;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--electric-cyan);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 400;
            animation: slideDown 1s ease-out 0.2s backwards;
        }

        /* Platform Tabs */
        .platform-tabs {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .platform-tab {
            padding: 0.75rem 2rem;
            background: rgba(26, 31, 46, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-gray);
            color: var(--text-gray);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            position: relative;
        }

        .platform-tab:hover {
            border-color: var(--electric-cyan);
            color: var(--electric-cyan);
        }

        .platform-tab.active {
            background: linear-gradient(135deg, var(--neon-blue), var(--electric-cyan));
            color: var(--pure-white);
            border-color: var(--electric-cyan);
            box-shadow: 0 0 20px var(--glow-blue);
        }

        .platform-tab .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--neon-pink);
            color: var(--pure-white);
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Main content */
        main {
            max-width: 1400px;
            margin: -1rem auto 4rem;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        /* Toolbar */
        .toolbar {
            background: rgba(26, 31, 46, 0.6);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            box-shadow: 0 0 30px var(--glow-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .toolbar-left {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-button {
            padding: 0.6rem 1.2rem;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-gray);
            color: var(--off-white);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-button:hover {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 15px var(--glow-cyan);
        }

        .toolbar-button.active {
            background: var(--electric-cyan);
            color: var(--space-dark);
            border-color: var(--electric-cyan);
        }

        .view-mode-buttons {
            display: flex;
            gap: 0.5rem;
        }

        /* Filter Controls */
        .filter-controls {
            background: rgba(26, 31, 46, 0.6);
            backdrop-filter: blur(10px);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            box-shadow: 0 0 30px var(--glow-blue);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-label {
            font-family: 'Oxanium', sans-serif;
            font-size: 0.75rem;
            color: var(--electric-cyan);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .search-input,
        .filter-select,
        .date-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-gray);
            border-radius: 6px;
            color: var(--off-white);
            font-family: 'Sora', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus,
        .filter-select:focus,
        .date-input:focus {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 20px var(--glow-cyan);
        }

        .search-input::placeholder {
            color: var(--text-gray);
            opacity: 0.6;
        }

        .filter-select option {
            background: var(--space-dark);
            color: var(--off-white);
        }

        .multi-select {
            min-height: 100px;
        }

        .results-count {
            font-family: 'Oxanium', sans-serif;
            font-size: 0.9rem;
            color: var(--text-gray);
            padding: 0.75rem 1.5rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--electric-cyan);
            border-radius: 6px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .results-count .count {
            color: var(--electric-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            font-family: 'Oxanium', sans-serif;
            font-size: 1.1rem;
            color: var(--electric-cyan);
            letter-spacing: 0.2em;
            text-shadow: 0 0 10px var(--glow-cyan);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Content Container */
        #contentContainer {
            animation: fadeIn 0.5s ease-out;
        }

        /* Grid View */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2.5rem 2rem;
            animation: fadeIn 1s ease-out;
        }

        /* List View */
        .repo-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 1s ease-out;
        }

        /* Compact View */
        .repo-compact {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            animation: fadeIn 1s ease-out;
        }

        /* Repository cards */
        .repo-card {
            background: rgba(26, 31, 46, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-gray);
            padding: 2.5rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: cardSlideIn 0.6s ease-out backwards;
            border-radius: 12px;
            overflow: hidden;
        }

        .repo-card:nth-child(1) { animation-delay: 0.1s; }
        .repo-card:nth-child(2) { animation-delay: 0.15s; }
        .repo-card:nth-child(3) { animation-delay: 0.2s; }
        .repo-card:nth-child(4) { animation-delay: 0.25s; }
        .repo-card:nth-child(5) { animation-delay: 0.3s; }
        .repo-card:nth-child(6) { animation-delay: 0.35s; }

        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg,
                rgba(0, 212, 255, 0.1) 0%,
                rgba(0, 102, 255, 0.1) 100%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .repo-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--electric-cyan);
            box-shadow:
                0 0 40px var(--glow-cyan),
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .repo-card:hover::before {
            opacity: 1;
        }

        /* List view specific styles */
        .repo-list .repo-card {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 2rem;
            padding: 2rem;
        }

        /* Compact view specific styles */
        .repo-compact .repo-card {
            padding: 1.5rem;
        }

        .repo-rank {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--electric-cyan), var(--neon-blue));
            color: var(--space-dark);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow:
                0 0 20px var(--glow-cyan),
                0 4px 12px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--pure-white);
            z-index: 10;
        }

        .bookmark-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(26, 31, 46, 0.8);
            border: 1px solid var(--border-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            font-size: 1.2rem;
        }

        .bookmark-btn:hover {
            background: var(--electric-cyan);
            border-color: var(--electric-cyan);
            transform: scale(1.1);
        }

        .bookmark-btn.bookmarked {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
        }

        .repo-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--pure-white);
            margin-bottom: 0.5rem;
            line-height: 1.3;
            transition: all 0.3s ease;
        }

        .repo-card:hover .repo-name {
            color: var(--electric-cyan);
            text-shadow: 0 0 15px var(--glow-cyan);
        }

        .repo-author {
            font-family: 'Oxanium', sans-serif;
            font-size: 0.85rem;
            color: var(--electric-cyan);
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .repo-description {
            font-size: 1.05rem;
            color: var(--text-gray);
            margin-bottom: 1.5rem;
            line-height: 1.7;
            min-height: 3.4rem;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .repo-meta-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .repo-stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-gray);
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Oxanium', sans-serif;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .stat-icon {
            font-size: 1.2rem;
            color: var(--electric-cyan);
        }

        .repo-language {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 102, 255, 0.2));
            border: 1px solid var(--electric-cyan);
            color: var(--electric-cyan);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--glow-cyan);
            margin-right: 0.5rem;
        }

        .repo-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .topic-tag {
            padding: 0.25rem 0.75rem;
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--text-gray);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.7rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .topic-tag:hover {
            background: rgba(0, 212, 255, 0.25);
            color: var(--electric-cyan);
        }

        .platform-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: var(--neon-purple);
            color: var(--pure-white);
            font-family: 'Oxanium', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .platform-badge.github { background: var(--neon-blue); }
        .platform-badge.huggingface { background: #FFD21E; color: #000; }
        .platform-badge.llmarena { background: var(--neon-purple); }

        /* Error state */
        .error-message {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.5);
            border-left: 4px solid #dc2626;
            padding: 2rem;
            margin: 2rem 0;
            font-family: 'Sora', sans-serif;
            color: #fca5a5;
            border-radius: 8px;
        }

        /* Footer */
        footer {
            background: var(--space-medium);
            color: var(--text-gray);
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 6rem;
            border-top: 1px solid var(--border-gray);
            box-shadow: 0 -20px 40px rgba(0, 0, 0, 0.3);
        }

        footer p {
            font-family: 'Sora', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        .footer-accent {
            color: var(--electric-cyan);
            font-weight: 600;
            text-shadow: 0 0 10px var(--glow-cyan);
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .platform-tabs {
                gap: 0.5rem;
            }

            .platform-tab {
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }

            .repo-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .filter-controls {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }

            .repo-card {
                padding: 2rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="subtitle">Multi-Platform Discovery</div>
            <h1>AI Discovery Hub</h1>

            <div class="platform-tabs">
                <div class="platform-tab active" data-platform="github">
                    🐙 GitHub
                </div>
                <div class="platform-tab" data-platform="huggingface">
                    🤗 HuggingFace
                    <span class="badge">NEW</span>
                </div>
                <div class="platform-tab" data-platform="llmarena">
                    🏆 LLM Arena
                    <span class="badge">NEW</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="toolbar-button" id="bookmarksBtn">
                    ⭐ Bookmarks (<span id="bookmarkCount">0</span>)
                </button>
                <button class="toolbar-button" id="compareBtn">
                    🔄 Compare
                </button>
            </div>
            <div class="view-mode-buttons">
                <button class="toolbar-button active" data-view="grid">
                    ▦ Grid
                </button>
                <button class="toolbar-button" data-view="list">
                    ☰ List
                </button>
                <button class="toolbar-button" data-view="compact">
                    ▤ Compact
                </button>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <div class="control-group">
                <label class="control-label">Search</label>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search..."
                />
            </div>

            <div class="control-group" id="dateRangeGroup">
                <label class="control-label">Date From</label>
                <input
                    type="date"
                    id="dateFrom"
                    class="date-input"
                />
            </div>

            <div class="control-group" id="dateToGroup">
                <label class="control-label">Date To</label>
                <input
                    type="date"
                    id="dateTo"
                    class="date-input"
                />
            </div>

            <div class="control-group" id="languageGroup">
                <label class="control-label">Languages</label>
                <select id="languageFilter" class="filter-select multi-select" multiple>
                </select>
            </div>

            <div class="control-group" id="categoryGroup" style="display: none;">
                <label class="control-label">Category</label>
                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                    <option value="nlp">NLP</option>
                    <option value="computer-vision">Computer Vision</option>
                    <option value="audio">Audio</option>
                    <option value="multimodal">Multimodal</option>
                    <option value="reinforcement-learning">RL</option>
                    <option value="tabular">Tabular</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Sort By</label>
                <select id="sortBy" class="filter-select">
                    <option value="stars">Most Stars</option>
                    <option value="forks">Most Forks</option>
                    <option value="updated">Recently Updated</option>
                    <option value="created">Recently Created</option>
                    <option value="issues">Most Issues</option>
                </select>
            </div>

            <div class="results-count">
                <span class="count" id="resultsCount">0</span> results
            </div>
        </div>

        <!-- Content Container -->
        <div id="contentContainer">
            <div class="loading">Loading discoveries</div>
        </div>
    </main>

    <footer>
        <p>Powered by <span class="footer-accent">GitHub</span> · <span class="footer-accent">HuggingFace</span> · <span class="footer-accent">LLM Arena</span></p>
        <p style="margin-top: 0.5rem; opacity: 0.7; font-size: 0.9rem;">Last Updated: <span id="lastUpdate">...</span></p>
    </footer>

    <script>
        // API Configuration
        const GITHUB_API = 'https://api.github.com';
        const HUGGINGFACE_API = 'https://huggingface.co/api';
        const LLM_ARENA_API = 'https://lmarena.ai/api'; // Note: We'll need to verify the actual endpoint

        const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000; // 1 week

        // Global State
        let currentPlatform = 'github';
        let currentView = 'grid';
        let allItems = [];
        let filteredItems = [];
        let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '{}');

        // Utility Functions
        function getWeekNumber(date = new Date()) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }

        function formatRelativeTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);

            if (diffInSeconds < 60) return 'just now';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
            if (diffInSeconds < 604800) return `${Math.floor(diffInSeconds / 86400)}d ago`;
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getCacheKey(platform, params = {}) {
            return `${platform}_${JSON.stringify(params)}`;
        }

        function isCacheValid(cachedData) {
            if (!cachedData || !cachedData.timestamp) return false;
            return (Date.now() - cachedData.timestamp) < CACHE_DURATION;
        }

        // Bookmark Functions
        function isBookmarked(id, platform) {
            const key = `${platform}_${id}`;
            return bookmarks[key] !== undefined;
        }

        function toggleBookmark(item, platform) {
            const key = `${platform}_${item.id}`;
            if (bookmarks[key]) {
                delete bookmarks[key];
            } else {
                bookmarks[key] = { ...item, platform, bookmarkedAt: Date.now() };
            }
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            updateBookmarkCount();
            return !bookmarks[key];
        }

        function updateBookmarkCount() {
            document.getElementById('bookmarkCount').textContent = Object.keys(bookmarks).length;
        }

        // API Functions - GitHub
        async function fetchGitHubRepos() {
            try {
                const cacheKey = getCacheKey('github', { dateFrom: dateFrom, dateTo: dateTo });
                const cached = localStorage.getItem(cacheKey);

                if (cached) {
                    const cachedData = JSON.parse(cached);
                    if (isCacheValid(cachedData)) {
                        console.log('Using cached GitHub data');
                        return cachedData.items;
                    }
                }

                const dateFrom = document.getElementById('dateFrom').value || getDefaultDateFrom();
                const dateTo = document.getElementById('dateTo').value || getDefaultDateTo();

                const query = `created:${dateFrom}..${dateTo}`;
                const url = `${GITHUB_API}/search/repositories?q=${encodeURIComponent(query)}&sort=stars&order=desc&per_page=30`;

                const response = await fetch(url);
                if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);

                const data = await response.json();
                const items = data.items.map(repo => ({
                    id: repo.id,
                    name: repo.name,
                    author: repo.owner.login,
                    description: repo.description,
                    url: repo.html_url,
                    stars: repo.stargazers_count,
                    forks: repo.forks_count,
                    watchers: repo.watchers_count,
                    issues: repo.open_issues_count,
                    language: repo.language,
                    topics: repo.topics || [],
                    created_at: repo.created_at,
                    updated_at: repo.updated_at,
                    platform: 'github'
                }));

                localStorage.setItem(cacheKey, JSON.stringify({ items, timestamp: Date.now() }));
                return items;
            } catch (error) {
                console.error('Error fetching GitHub repos:', error);
                throw error;
            }
        }

        // API Functions - HuggingFace
        async function fetchHuggingFaceModels() {
            try {
                const cacheKey = getCacheKey('huggingface');
                const cached = localStorage.getItem(cacheKey);

                if (cached) {
                    const cachedData = JSON.parse(cached);
                    if (isCacheValid(cachedData)) {
                        console.log('Using cached HuggingFace data');
                        return cachedData.items;
                    }
                }

                // HuggingFace trending models endpoint
                const url = `${HUGGINGFACE_API}/models?sort=trending&limit=30`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`HuggingFace API error: ${response.status}`);

                const data = await response.json();
                const items = data.map(model => ({
                    id: model.id || model.modelId,
                    name: model.modelId || model.id,
                    author: model.author || 'Unknown',
                    description: model.description || model.cardData?.description || 'No description available',
                    url: `https://huggingface.co/${model.modelId || model.id}`,
                    stars: model.likes || 0,
                    downloads: model.downloads || 0,
                    language: model.pipeline_tag || 'N/A',
                    topics: model.tags || [],
                    created_at: model.createdAt || model.created_at,
                    updated_at: model.lastModified || model.updated_at,
                    platform: 'huggingface',
                    category: model.pipeline_tag
                }));

                localStorage.setItem(cacheKey, JSON.stringify({ items, timestamp: Date.now() }));
                return items;
            } catch (error) {
                console.error('Error fetching HuggingFace models:', error);
                throw error;
            }
        }

        // API Functions - LLM Arena
        async function fetchLLMArenaLeaderboard() {
            try {
                const cacheKey = getCacheKey('llmarena');
                const cached = localStorage.getItem(cacheKey);

                if (cached) {
                    const cachedData = JSON.parse(cached);
                    if (isCacheValid(cachedData)) {
                        console.log('Using cached LLM Arena data');
                        return cachedData.items;
                    }
                }

                // Mock data for LLM Arena (we'll need to find the actual API endpoint)
                // For now, using a placeholder structure
                const mockData = [
                    { id: 1, name: 'GPT-4', author: 'OpenAI', elo: 1365, votes: 25000, description: 'Latest GPT-4 model with improved reasoning' },
                    { id: 2, name: 'Claude 3.5 Sonnet', author: 'Anthropic', elo: 1348, votes: 22000, description: 'Advanced reasoning and coding capabilities' },
                    { id: 3, name: 'Gemini Pro', author: 'Google', elo: 1320, votes: 18000, description: 'Multimodal AI model' },
                    // Add more mock data as needed
                ];

                const items = mockData.map(model => ({
                    id: model.id,
                    name: model.name,
                    author: model.author,
                    description: model.description,
                    url: '#',
                    elo: model.elo,
                    votes: model.votes,
                    platform: 'llmarena',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }));

                localStorage.setItem(cacheKey, JSON.stringify({ items, timestamp: Date.now() }));
                return items;
            } catch (error) {
                console.error('Error fetching LLM Arena data:', error);
                throw error;
            }
        }

        // Date helpers
        function getDefaultDateFrom() {
            const date = new Date();
            date.setDate(date.getDate() - 7);
            return date.toISOString().split('T')[0];
        }

        function getDefaultDateTo() {
            return new Date().toISOString().split('T')[0];
        }

        // Render Functions
        function renderItems(items) {
            const container = document.getElementById('contentContainer');

            if (!items || items.length === 0) {
                container.innerHTML = '<div class="error-message">No items match your filters.</div>';
                return;
            }

            document.getElementById('resultsCount').textContent = items.length;

            const viewClass = `repo-${currentView}`;
            let html = `<div class="${viewClass}">`;

            items.forEach((item, index) => {
                html += renderCard(item, index);
            });

            html += '</div>';
            container.innerHTML = html;

            // Update last update timestamp
            document.getElementById('lastUpdate').textContent = new Date().toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Add bookmark click handlers
            document.querySelectorAll('.bookmark-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const itemId = btn.dataset.itemId;
                    const item = items.find(i => i.id == itemId);
                    if (item) {
                        toggleBookmark(item, currentPlatform);
                        btn.classList.toggle('bookmarked');
                        btn.textContent = btn.classList.contains('bookmarked') ? '⭐' : '☆';
                    }
                });
            });
        }

        function renderCard(item, index) {
            const bookmarked = isBookmarked(item.id, item.platform);

            return `
                <div class="repo-card" onclick="window.open('${item.url}', '_blank')">
                    <div class="bookmark-btn ${bookmarked ? 'bookmarked' : ''}" data-item-id="${item.id}">
                        ${bookmarked ? '⭐' : '☆'}
                    </div>
                    <div class="repo-rank">${index + 1}</div>

                    <div class="platform-badge ${item.platform}">${item.platform}</div>

                    <h3 class="repo-name">${item.name}</h3>
                    <div class="repo-author">by ${item.author}</div>
                    <p class="repo-description">${item.description || 'No description available'}</p>

                    ${item.platform === 'github' || item.platform === 'huggingface' ? `
                        <div class="repo-meta">
                            <div class="repo-meta-item" title="Created ${new Date(item.created_at).toLocaleDateString()}">
                                📅 ${formatRelativeTime(item.created_at)}
                            </div>
                            <div class="repo-meta-item" title="Last updated ${new Date(item.updated_at).toLocaleDateString()}">
                                🔄 ${formatRelativeTime(item.updated_at)}
                            </div>
                            ${item.issues > 0 ? `
                                <div class="repo-meta-item">
                                    🔧 ${formatNumber(item.issues)} issues
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="repo-stats">
                        ${item.stars !== undefined ? `
                            <div class="stat">
                                <span class="stat-icon">★</span>
                                <span>${formatNumber(item.stars)}</span>
                            </div>
                        ` : ''}
                        ${item.forks !== undefined ? `
                            <div class="stat">
                                <span class="stat-icon">⑂</span>
                                <span>${formatNumber(item.forks)}</span>
                            </div>
                        ` : ''}
                        ${item.downloads !== undefined ? `
                            <div class="stat">
                                <span class="stat-icon">⬇</span>
                                <span>${formatNumber(item.downloads)}</span>
                            </div>
                        ` : ''}
                        ${item.elo !== undefined ? `
                            <div class="stat">
                                <span class="stat-icon">🏆</span>
                                <span>ELO: ${item.elo}</span>
                            </div>
                        ` : ''}
                        ${item.votes !== undefined ? `
                            <div class="stat">
                                <span class="stat-icon">🗳️</span>
                                <span>${formatNumber(item.votes)} votes</span>
                            </div>
                        ` : ''}
                    </div>

                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                        ${item.language ? `<div class="repo-language">${item.language}</div>` : ''}
                        ${item.topics && item.topics.length > 0 ? `
                            <div class="repo-topics">
                                ${item.topics.slice(0, 3).map(topic =>
                                    `<span class="topic-tag">${topic}</span>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Filter and Sort
        function populateLanguageFilter() {
            const languages = [...new Set(allItems.map(item => item.language).filter(Boolean))].sort();
            const select = document.getElementById('languageFilter');

            select.innerHTML = '';
            languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang;
                select.appendChild(option);
            });
        }

        function applyFiltersAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedLanguages = Array.from(document.getElementById('languageFilter').selectedOptions).map(opt => opt.value);
            const selectedCategory = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            // Filter items
            filteredItems = allItems.filter(item => {
                const matchesSearch = !searchTerm ||
                    item.name.toLowerCase().includes(searchTerm) ||
                    (item.description && item.description.toLowerCase().includes(searchTerm)) ||
                    item.author.toLowerCase().includes(searchTerm);

                const matchesLanguage = selectedLanguages.length === 0 || selectedLanguages.includes(item.language);
                const matchesCategory = !selectedCategory || item.category === selectedCategory;

                return matchesSearch && matchesLanguage && matchesCategory;
            });

            // Sort items
            filteredItems.sort((a, b) => {
                switch (sortBy) {
                    case 'stars':
                        return (b.stars || b.elo || 0) - (a.stars || a.elo || 0);
                    case 'forks':
                        return (b.forks || 0) - (a.forks || 0);
                    case 'updated':
                        return new Date(b.updated_at) - new Date(a.updated_at);
                    case 'created':
                        return new Date(b.created_at) - new Date(a.created_at);
                    case 'issues':
                        return (b.issues || 0) - (a.issues || 0);
                    default:
                        return 0;
                }
            });

            renderItems(filteredItems);
        }

        // Platform Switching
        async function switchPlatform(platform) {
            currentPlatform = platform;

            // Update active tab
            document.querySelectorAll('.platform-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.platform === platform);
            });

            // Show/hide relevant filters
            if (platform === 'huggingface') {
                document.getElementById('categoryGroup').style.display = 'block';
                document.getElementById('dateRangeGroup').style.display = 'none';
                document.getElementById('dateToGroup').style.display = 'none';
            } else if (platform === 'llmarena') {
                document.getElementById('categoryGroup').style.display = 'none';
                document.getElementById('dateRangeGroup').style.display = 'none';
                document.getElementById('dateToGroup').style.display = 'none';
                document.getElementById('languageGroup').style.display = 'none';
            } else {
                document.getElementById('categoryGroup').style.display = 'none';
                document.getElementById('dateRangeGroup').style.display = 'block';
                document.getElementById('dateToGroup').style.display = 'block';
                document.getElementById('languageGroup').style.display = 'block';
            }

            // Show loading
            document.getElementById('contentContainer').innerHTML = '<div class="loading">Loading discoveries</div>';

            try {
                // Fetch data based on platform
                if (platform === 'github') {
                    allItems = await fetchGitHubRepos();
                } else if (platform === 'huggingface') {
                    allItems = await fetchHuggingFaceModels();
                } else if (platform === 'llmarena') {
                    allItems = await fetchLLMArenaLeaderboard();
                }

                filteredItems = allItems;
                populateLanguageFilter();
                applyFiltersAndSort();
            } catch (error) {
                document.getElementById('contentContainer').innerHTML = `
                    <div class="error-message">
                        <strong>Unable to load data</strong><br>
                        ${error.message || 'Please try again later.'}
                    </div>
                `;
            }
        }

        // View Mode Switching
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('[data-view]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            renderItems(filteredItems);
        }

        // Event Listeners
        function setupEventListeners() {
            // Platform tabs
            document.querySelectorAll('.platform-tab').forEach(tab => {
                tab.addEventListener('click', () => switchPlatform(tab.dataset.platform));
            });

            // View mode buttons
            document.querySelectorAll('[data-view]').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });

            // Filters
            document.getElementById('searchInput').addEventListener('input', applyFiltersAndSort);
            document.getElementById('languageFilter').addEventListener('change', applyFiltersAndSort);
            document.getElementById('categoryFilter').addEventListener('change', applyFiltersAndSort);
            document.getElementById('sortBy').addEventListener('change', applyFiltersAndSort);
            document.getElementById('dateFrom').addEventListener('change', () => switchPlatform(currentPlatform));
            document.getElementById('dateTo').addEventListener('change', () => switchPlatform(currentPlatform));

            // Bookmarks button
            document.getElementById('bookmarksBtn').addEventListener('click', () => {
                if (Object.keys(bookmarks).length === 0) {
                    alert('No bookmarks yet! Click the ☆ icon on any item to bookmark it.');
                    return;
                }

                const bookmarkedItems = Object.values(bookmarks);
                allItems = bookmarkedItems;
                filteredItems = bookmarkedItems;
                populateLanguageFilter();
                applyFiltersAndSort();
            });

            // Compare button (placeholder)
            document.getElementById('compareBtn').addEventListener('click', () => {
                alert('Compare feature coming soon! This will allow you to compare multiple repositories side-by-side.');
            });
        }

        // Initialize
        async function init() {
            // Set default dates
            document.getElementById('dateFrom').value = getDefaultDateFrom();
            document.getElementById('dateTo').value = getDefaultDateTo();

            updateBookmarkCount();
            setupEventListeners();

            // Load GitHub by default
            await switchPlatform('github');
        }

        // Run on page load
        init();
    </script>
</body>
</html>
